# SPDX-License-Identifier: Apache-2.0
name: release
# A tag v* builds the plugin jar and publishes it with the Groovy script on
# the GitHub release. Alpha tags are pre-releases: the README's rollout
# applies, observe mode first.
on:
  push:
    tags: ["v*"]
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q -DskipTests=false package
      - run: |
          mkdir -p dist
          cp target/hibou-artifactory-plugin-*.jar dist/
          cp src/main/groovy/hibou.groovy dist/
          cp bench/hibou.properties dist/hibou.properties.example
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE-NOTES.md
