# SPDX-License-Identifier: Apache-2.0
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q test
  # The compatibility test needs a token of the seeded organization in a
  # Hibou container; it is skipped until the HIBOU_COMPAT_TOKEN secret exists.
  compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - id: secret
        env:
          TOKEN: ${{ secrets.HIBOU_COMPAT_TOKEN }}
        run: echo "present=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.secret.outputs.present == 'true'
        run: ./compat/run.sh
        env:
          HIBOU_TOKEN: ${{ secrets.HIBOU_COMPAT_TOKEN }}
      - if: steps.secret.outputs.present != 'true'
        run: echo "HIBOU_COMPAT_TOKEN not set; compatibility test skipped"
